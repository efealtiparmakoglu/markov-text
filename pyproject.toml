[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-text"
version = "1.0.0"
description = "Order-N Markov chain text generator from a local corpus, seeded and reproducible"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
markov-text = "markov_text.cli:main"

[tool.setuptools.packages.find]
include = ["markov_text*"]
